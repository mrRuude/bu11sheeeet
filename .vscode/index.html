<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hello World PWA with Alien">
    <meta name="theme-color" content="#2d1b4e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Alien Hello">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Alien's Hello World</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <link rel="stylesheet" href="./app.css">
</head>
<body>
    <div class="container">
        <div class="alien-container">
            <svg class="alien" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
                <!-- Head -->
                <ellipse cx="100" cy="100" rx="55" ry="80" fill="#4a9d6f"/>
                
                <!-- Large Eyes -->
                <ellipse cx="75" cy="85" rx="18" ry="28" fill="#000"/>
                <ellipse cx="125" cy="85" rx="18" ry="28" fill="#000"/>
                <ellipse cx="75" cy="88" rx="8" ry="12" fill="#00ff00"/>
                <ellipse cx="125" cy="88" rx="8" ry="12" fill="#00ff00"/>
                
                <!-- Mouth (slit) -->
                <line x1="90" y1="125" x2="110" y2="125" stroke="#2d5a3d" stroke-width="2"/>
                
                <!-- Neck -->
                <rect x="85" y="175" width="30" height="15" fill="#4a9d6f"/>
                
                <!-- Body -->
                <ellipse cx="100" cy="220" rx="40" ry="50" fill="#4a9d6f"/>
                
                <!-- Left Arm -->
                <g>
                    <line x1="65" y1="200" x2="40" y2="240" stroke="#4a9d6f" stroke-width="8"/>
                    <circle cx="40" cy="240" r="8" fill="#4a9d6f"/>
                </g>
                
                <!-- Right Arm -->
                <g>
                    <line x1="135" y1="200" x2="160" y2="240" stroke="#4a9d6f" stroke-width="8"/>
                    <circle cx="160" cy="240" r="8" fill="#4a9d6f"/>
                </g>
                
                <!-- Left Leg -->
                <line x1="80" y1="270" x2="75" y2="295" stroke="#4a9d6f" stroke-width="7"/>
                
                <!-- Right Leg -->
                <line x1="120" y1="270" x2="125" y2="295" stroke="#4a9d6f" stroke-width="7"/>
            </svg>
        </div>
        
        <h1>Hello World!</h1>
        <p class="greeting">Greetings, Earth dweller! <br>I am an Alien</p>
        
        <button id="installBtn" class="install-btn hidden">Install App</button>

        <div id="iosInstallHelp" class="ios-install-help hidden" role="status">
            <strong>Install on iPhone</strong>
            <span>Open this page in Safari, tap Share, then choose Add to Home Screen.</span>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
