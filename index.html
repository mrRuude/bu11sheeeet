<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Rocket Moons</title>
        <link rel="stylesheet" href="./app.css">
    </head>
    <body>
        <div id="game-wrap">
            <canvas id="game"></canvas>

            <div id="hud">
                <div id="score">Score: 0</div>
                <div id="lives">Lives: 3</div>
                <div id="audio">🔊 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.5"></div>
            </div>

            <div id="overlay" class="visible">
                <div class="overlay-card">
                    <h1 id="title">Rocket Moons</h1>
                    <p id="subtitle">Fly the rocket through moons and collect coins</p>
                    <button id="start">Start</button>
                    <p class="hint">Use Left/Right arrows or mouse/touch to move</p>
                </div>
            </div>
        </div>

        <script src="./app.js"></script>
    </body>
</html>
